# Runs the same checks as `npm run check` on every push and pull request (6z.73). Nothing here deploys: production
# still needs the owner's go-ahead (CLAUDE.md).
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - run: npx vite build
