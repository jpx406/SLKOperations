<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-build" content="dev" />
    <title>SLK Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
    <script>
      // same rules as src/client/display.ts, applied before the first paint: touch screens default to Sunlight and large controls
      (function () {
        var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches, t = null, d = null;
        try { t = localStorage.getItem('slk-theme'); d = localStorage.getItem('slk-density'); } catch (e) {}
        if (t === 'light' || (t !== 'dark' && touch)) document.documentElement.dataset.theme = 'light';
        if (d === 'touch' || (d !== 'desk' && touch)) document.documentElement.dataset.density = 'touch';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
